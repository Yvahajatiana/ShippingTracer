version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major bumps break the net8 baseline (EF Core 9, Microsoft.Extensions 9+)
    # or change licensing (MassTransit 9 is commercial): upgrade them by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      masstransit:
        patterns: ["MassTransit*"]
      testing:
        patterns: ["xunit*", "FluentAssertions", "Testcontainers*", "Microsoft.NET.Test.Sdk", "coverlet*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
