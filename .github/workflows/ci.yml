name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  # Must stay in the band pinned by global.json (8.0.400, rollForward latestPatch).
  DOTNET_SDK: 8.0.4xx
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.21.2
  HELM_VERSION: v4.3.1
  KUBECONFORM_VERSION: v0.8.0
  # Bounds of the Kubernetes versions the chart is validated against (Chart.yaml kubeVersion >= 1.27).
  KUBERNETES_MIN_VERSION: 1.27.0
  KUBERNETES_MAX_VERSION: 1.33.0

jobs:
  # Decides what the other jobs do. On a pull request, only the images whose inputs changed are
  # built and scanned, and a documentation-only change skips compilation, tests and images.
  # Pushes and manual runs build, scan and publish every image.
  # The 8 <service>-migrations images are only needed by the Helm hooks: they are built when the
  # repository variable KUBERNETES_DEPLOY is 'true' (docs/ci-cd.md).
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
      images: ${{ steps.scope.outputs.images }}
    steps:
      # The pull request file list comes from the GitHub API: no checkout needed.
      # With some-with-excludes, a filter matches a file that matches one of its rules and none of
      # its negated rules. Each image filter lists the files its Dockerfile copies, plus this workflow.
      - name: Changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!.github/dependabot.yml'
            dotnet: &dotnet
              - .github/workflows/ci.yml
              - .dockerignore
              - global.json
              - Directory.Build.props
              - src/BuildingBlocks/**
            migrations: &migrations
              - *dotnet
              - deploy/migrations/**
            gateway: [*dotnet, 'src/Gateway/**']
            customer: [*dotnet, 'src/Services/Customer/**']
            shipment: [*dotnet, 'src/Services/Shipment/**']
            tracking: [*dotnet, 'src/Services/Tracking/**']
            warehouse: [*dotnet, 'src/Services/Warehouse/**']
            delivery: [*dotnet, 'src/Services/Delivery/**']
            billing: [*dotnet, 'src/Services/Billing/**']
            notification: [*dotnet, 'src/Services/Notification/**']
            reporting: [*dotnet, 'src/Services/Reporting/**']
            portals: &portals
              - .github/workflows/ci.yml
              - frontends/**
            customer-portal: *portals
            operations-portal: *portals
            admin-portal: *portals
            rabbitmq: [.github/workflows/ci.yml, 'deploy/rabbitmq/**']
            landing: [.github/workflows/ci.yml, 'deploy/landing/**']
            customer-migrations: [*migrations, 'src/Services/Customer/**']
            shipment-migrations: [*migrations, 'src/Services/Shipment/**']
            tracking-migrations: [*migrations, 'src/Services/Tracking/**']
            warehouse-migrations: [*migrations, 'src/Services/Warehouse/**']
            delivery-migrations: [*migrations, 'src/Services/Delivery/**']
            billing-migrations: [*migrations, 'src/Services/Billing/**']
            notification-migrations: [*migrations, 'src/Services/Notification/**']
            reporting-migrations: [*migrations, 'src/Services/Reporting/**']
      - name: Jobs and image matrix
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          CHANGED: ${{ steps.filter.outputs.changes || '[]' }}
          CODE_CHANGED: ${{ steps.filter.outputs.code || 'false' }}
          KUBERNETES_DEPLOY: ${{ vars.KUBERNETES_DEPLOY }}
          IMAGES: |
            [
              { "name": "gateway", "context": ".", "dockerfile": "src/Gateway/ParcelFlow.Gateway/Dockerfile", "build-arg": "" },
              { "name": "customer", "context": ".", "dockerfile": "src/Services/Customer/ParcelFlow.Customer.Api/Dockerfile", "build-arg": "" },
              { "name": "shipment", "context": ".", "dockerfile": "src/Services/Shipment/ParcelFlow.Shipment.Api/Dockerfile", "build-arg": "" },
              { "name": "tracking", "context": ".", "dockerfile": "src/Services/Tracking/ParcelFlow.Tracking.Api/Dockerfile", "build-arg": "" },
              { "name": "warehouse", "context": ".", "dockerfile": "src/Services/Warehouse/ParcelFlow.Warehouse.Api/Dockerfile", "build-arg": "" },
              { "name": "delivery", "context": ".", "dockerfile": "src/Services/Delivery/ParcelFlow.Delivery.Api/Dockerfile", "build-arg": "" },
              { "name": "billing", "context": ".", "dockerfile": "src/Services/Billing/ParcelFlow.Billing.Api/Dockerfile", "build-arg": "" },
              { "name": "notification", "context": ".", "dockerfile": "src/Services/Notification/ParcelFlow.Notification.Api/Dockerfile", "build-arg": "" },
              { "name": "reporting", "context": ".", "dockerfile": "src/Services/Reporting/ParcelFlow.Reporting.Api/Dockerfile", "build-arg": "" },
              { "name": "customer-portal", "context": "frontends", "dockerfile": "frontends/Dockerfile", "build-arg": "PORTAL=customer-portal" },
              { "name": "operations-portal", "context": "frontends", "dockerfile": "frontends/Dockerfile", "build-arg": "PORTAL=operations-portal" },
              { "name": "admin-portal", "context": "frontends", "dockerfile": "frontends/Dockerfile", "build-arg": "PORTAL=admin-portal" },
              { "name": "rabbitmq", "context": "deploy/rabbitmq", "dockerfile": "deploy/rabbitmq/Dockerfile", "build-arg": "" },
              { "name": "landing", "context": "deploy/landing", "dockerfile": "deploy/landing/Dockerfile", "build-arg": "" },
              { "name": "customer-migrations", "context": ".", "dockerfile": "deploy/migrations/Dockerfile", "build-arg": "SERVICE=Customer" },
              { "name": "shipment-migrations", "context": ".", "dockerfile": "deploy/migrations/Dockerfile", "build-arg": "SERVICE=Shipment" },
              { "name": "tracking-migrations", "context": ".", "dockerfile": "deploy/migrations/Dockerfile", "build-arg": "SERVICE=Tracking" },
              { "name": "warehouse-migrations", "context": ".", "dockerfile": "deploy/migrations/Dockerfile", "build-arg": "SERVICE=Warehouse" },
              { "name": "delivery-migrations", "context": ".", "dockerfile": "deploy/migrations/Dockerfile", "build-arg": "SERVICE=Delivery" },
              { "name": "billing-migrations", "context": ".", "dockerfile": "deploy/migrations/Dockerfile", "build-arg": "SERVICE=Billing" },
              { "name": "notification-migrations", "context": ".", "dockerfile": "deploy/migrations/Dockerfile", "build-arg": "SERVICE=Notification" },
              { "name": "reporting-migrations", "context": ".", "dockerfile": "deploy/migrations/Dockerfile", "build-arg": "SERVICE=Reporting" }
            ]
        run: |
          set -euo pipefail
          if [[ "$EVENT" == pull_request ]]; then
            code="$CODE_CHANGED"
            changed="$CHANGED"
            # A documentation file under an image directory (frontends/README.md) builds nothing.
            if [[ "$code" != true ]]; then changed='[]'; fi
          else
            code=true
            changed=$(jq -c '[.[].name]' <<< "$IMAGES")
          fi
          images=$(jq -c --argjson changed "$changed" --arg k8s "$KUBERNETES_DEPLOY" '
            [ .[] | select(.name as $name | $changed | index($name))
                  | select(($k8s == "true") or (.name | endswith("-migrations") | not)) ]' <<< "$IMAGES")
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "images=$images" >> "$GITHUB_OUTPUT"
          {
            echo "Code jobs: **$code**. Kubernetes migration images: **${KUBERNETES_DEPLOY:-false}**."
            echo
            echo "Images: $(jq -r 'if length == 0 then "none" else map("`" + .name + "`") | join(", ") end' <<< "$images")"
          } >> "$GITHUB_STEP_SUMMARY"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan full git history with gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE"
          git /repo --config /repo/.gitleaks.toml --gitleaks-ignore-path /repo/.gitleaksignore
          --redact --no-banner --exit-code 1

  build:
    name: Build, unit and contract tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK }}
      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore ParcelFlow.sln
      - name: Build (warnings as errors)
        run: dotnet build ParcelFlow.sln --configuration Release --no-restore
      - name: Unit, contract, BuildingBlocks and Gateway tests
        run: |
          set -euo pipefail
          find tests -name '*.csproj' ! -name '*.IntegrationTests.csproj' | sort | while read -r project; do
            echo "::group::$project"
            dotnet test "$project" --configuration Release --no-build \
              --logger "trx;LogFilePrefix=$(basename "$project" .csproj)" --results-directory TestResults
            echo "::endgroup::"
          done
      - name: EF Core model drift
        run: |
          set -euo pipefail
          dotnet tool restore
          for infra in src/Services/*/ParcelFlow.*.Infrastructure; do
            echo "::group::$infra"
            dotnet ef migrations has-pending-model-changes --project "$infra" --configuration Release --no-build
            echo "::endgroup::"
          done
      - name: Vulnerable NuGet packages
        run: |
          set -euo pipefail
          dotnet list ParcelFlow.sln package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages detected"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-unit
          path: TestResults/*.trx
          if-no-files-found: ignore

  # Two jobs of four services, balanced on their test durations: each job pays the .NET setup,
  # the restore and the rounding to the minute once for about four minutes of tests.
  integration:
    name: Integration tests (${{ matrix.services }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: 1, services: Notification Reporting Delivery Customer }
          - { group: 2, services: Shipment Billing Tracking Warehouse }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK }}
      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      # Every service runs even when an earlier one fails; one TRX report per service.
      - name: Run Testcontainers integration tests
        env:
          SERVICES: ${{ matrix.services }}
        run: |
          set -uo pipefail
          failed=""
          for service in $SERVICES; do
            echo "::group::$service"
            dotnet test "tests/Services/$service/ParcelFlow.$service.IntegrationTests" \
              --configuration Release \
              --logger "trx;LogFilePrefix=$service" \
              --results-directory TestResults || failed="$failed $service"
            echo "::endgroup::"
          done
          if [[ -n "$failed" ]]; then
            echo "::error::Integration tests failed:$failed"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-integration-${{ matrix.group }}
          path: TestResults/*.trx
          if-no-files-found: ignore

  gateway-smoke:
    name: Gateway Kestrel smoke test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      # The smoke script runs the Debug build output of the gateway.
      - name: Build gateway (Debug)
        run: dotnet build src/Gateway/ParcelFlow.Gateway --configuration Debug
      - name: Run Kestrel smoke test
        run: node tests/Gateway/kestrel-smoke.mjs

  # Business journey of tests/e2e against the compose stack, through the gateway with real
  # Keycloak tokens. The portals are not started: the journey only calls the gateway and the
  # frontends job already builds them.
  e2e:
    name: E2E business journey
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: parcelflow-e2e
      E2E_SERVICES: gateway customer shipment tracking warehouse delivery billing notification reporting
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The example values are throwaway secrets of a stack that lives for the job only.
      - name: Local settings
        run: cp .env.example .env
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 600 $E2E_SERVICES
      - name: Run the business journey
        run: node tests/e2e/business-journey.mjs
      - name: Dump the stack state and logs
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --timestamps > compose-logs.txt
          docker compose logs --no-color --tail 200
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-compose-logs
          path: compose-logs.txt
          if-no-files-found: ignore
      - name: Tear down the stack
        if: always()
        run: docker compose down -v --remove-orphans

  frontends:
    name: Frontends (lint, tests, build)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontends
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontends/package-lock.json
      - name: Install
        run: npm ci
      - name: Vulnerable npm packages
        run: npm run audit
      - name: Formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production builds
        run: npm run build

  docker-lint:
    name: Dockerfile lint and compose validation
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Lints every file named Dockerfile with the ignores documented in .hadolint.yaml.
      # Pinned to the commit of v3.5.0, which bundles hadolint v2.15.1.
      - name: Lint Dockerfiles with hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          recursive: true
          config: .hadolint.yaml
      # The compose file refuses to render without its required secrets; dummy values are enough here.
      - name: Validate docker-compose.yml
        env:
          POSTGRES_PASSWORD: ci-dummy
          RABBITMQ_PASSWORD: ci-dummy
          KEYCLOAK_ADMIN_PASSWORD: ci-dummy
          NOTIFICATION_CLIENT_SECRET: ci-dummy
          DELIVERY_PROOF_KEY: ci-dummy
          DEMO_USER_PASSWORD: ci-dummy
        run: docker compose --file docker-compose.yml config --quiet
      - name: Validate deploy/dokploy/docker-compose.yml
        env:
          DEMO_DOMAIN: demo.example.com
          POSTGRES_PASSWORD: ci-dummy
          RABBITMQ_PASSWORD: ci-dummy
          KEYCLOAK_ADMIN_PASSWORD: ci-dummy
          NOTIFICATION_CLIENT_SECRET: ci-dummy
          DELIVERY_PROOF_KEY: ci-dummy
          DEMO_USER_PASSWORD: ci-dummy
        run: docker compose --file deploy/dokploy/docker-compose.yml config --quiet

  helm:
    name: Helm chart lint and schema validation
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CHART: deploy/helm/parcelflow
      RENDER_DIR: ${{ github.workspace }}/rendered
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install kubeconform
        run: |
          set -euo pipefail
          base="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/kubeconform-linux-amd64.tar.gz"
          curl -fsSLO "$base/CHECKSUMS"
          grep ' kubeconform-linux-amd64.tar.gz$' CHECKSUMS | sha256sum --check --strict
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
      # Dummy secrets: the local profile renders the Secret from values, as deploy/kubernetes/local.sh does.
      - name: Dummy local secrets
        run: |
          cat > "$RUNNER_TEMP/secrets-local.yaml" <<'YAML'
          secrets:
            values:
              postgres-password: ci-dummy
              rabbitmq-password: ci-dummy
              notification-client-secret: ci-dummy
              delivery-proof-key: ci-dummy
              keycloak-admin-password: ci-dummy
              demo-user-password: ci-dummy
          YAML
      # Four profiles: local (bundled infrastructure, Development), production example with
      # Ingress, production example with Gateway API routes, production with an existing Secret.
      - name: Lint and render
        run: |
          set -euo pipefail
          mkdir -p "$RENDER_DIR"
          local_args=(-f deploy/kubernetes/values-local.yaml -f "$RUNNER_TEMP/secrets-local.yaml"
            --set-file infrastructure.keycloak.realm=deploy/keycloak/parcelflow-realm.json --set-string image.tag=local)
          prod_args=(-f deploy/kubernetes/values-production.example.yaml)
          route_args=("${prod_args[@]}" --set ingress.enabled=false --set httpRoute.enabled=true
            --set 'httpRoute.parentRefs[0].name=public' --set 'httpRoute.parentRefs[0].namespace=gateway-system')
          existing_args=("${prod_args[@]}" --set externalSecrets.enabled=false --set secrets.existingSecret=parcelflow-secrets)
          for profile in local production gateway-api existing-secret; do
            case "$profile" in
              local) args=("${local_args[@]}") ;;
              production) args=("${prod_args[@]}") ;;
              gateway-api) args=("${route_args[@]}") ;;
              existing-secret) args=("${existing_args[@]}") ;;
            esac
            echo "::group::$profile"
            helm lint "$CHART" --strict "${args[@]}"
            helm template parcelflow "$CHART" --namespace parcelflow --kube-version "$KUBERNETES_MIN_VERSION" \
              "${args[@]}" > "$RENDER_DIR/$profile.yaml"
            echo "::endgroup::"
          done
      # Validated against the oldest Kubernetes version allowed by Chart.yaml (kubeVersion) and a
      # recent one. CRDs (ExternalSecret, HTTPRoute) use the datreeio CRDs catalog schemas.
      - name: Validate manifests with kubeconform
        run: |
          set -euo pipefail
          for version in "$KUBERNETES_MIN_VERSION" "$KUBERNETES_MAX_VERSION"; do
            echo "::group::Kubernetes $version"
            kubeconform -strict -summary -kubernetes-version "$version" \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              "$RENDER_DIR"/*.yaml
            echo "::endgroup::"
          done

  # Downloads the Trivy vulnerability database once, into the cache restored by trivy-action in
  # every image job (same key and directory as trivy-action v0.36.0). Runs while the build job
  # does, and the image jobs wait for it. It never fails: if the download fails, nothing is cached
  # and every image job downloads the database itself, as before, so the scans still run.
  trivy-db:
    name: Trivy database
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Cache key
        id: day
        run: echo "day=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
      - name: Trivy cache
        id: cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: cache-trivy-${{ steps.day.outputs.day }}
      # Same Trivy version as the one trivy-action v0.36.0 installs; setup-trivy v0.3.1 is the
      # release trivy-action pins on its main branch (v0.36.0 still ships v0.2.6).
      - name: Install Trivy
        id: install
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0
          cache: true
      - name: Download the vulnerability database
        id: download
        if: steps.cache.outputs.cache-hit != 'true' && steps.install.outcome == 'success'
        continue-on-error: true
        run: trivy image --download-db-only --cache-dir "$GITHUB_WORKSPACE/.cache/trivy"
      # A partial database must not be saved under the daily key: without the directory, the cache
      # post step saves nothing.
      - name: Discard a failed download
        if: steps.cache.outputs.cache-hit != 'true' && steps.download.outcome != 'success'
        run: |
          rm -rf "$GITHUB_WORKSPACE/.cache/trivy"
          echo "::warning::Trivy database not prewarmed: each image job downloads it"

  images:
    name: Image (${{ matrix.image.name }})
    # Publication also requires a clean secret scan and Dockerfile lint. Integration and smoke
    # tests are enforced before the merge by the CI OK check, so they do not delay the builds.
    # The matrix comes from the changes job: every image on a push, the changed ones on a pull request.
    needs: [changes, secret-scan, build, frontends, docker-lint, trivy-db]
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Permissions cannot depend on the event: packages:write is only used by the push steps,
    # which are gated to push events on main and develop. Fork pull requests always receive a
    # read-only token from GitHub. security-events:write uploads the Trivy SARIF report.
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    env:
      # Only branch pushes to this repository publish; pull requests and forks build and scan only.
      PUBLISH: ${{ github.event_name == 'push' && !github.event.repository.fork && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
      SCAN_REF: local/parcelflow-${{ matrix.image.name }}:scan
    steps:
      - uses: actions/checkout@v7
      # GHCR repository names must be lower case.
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/parcelflow-${{ matrix.image.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      # No semver tags: the workflow does not run on git tags.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      # Loaded into the local Docker engine so that Trivy scans, and docker push publishes, the
      # very same image. OCI labels come from the Dockerfile and the VERSION/REVISION build args.
      # Build day: busts the cached `apk upgrade` layers of the Alpine images (Dockerfile ARG).
      - name: Security updates date
        id: date
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Build
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          load: true
          push: false
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.SCAN_REF }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            SECURITY_UPDATES_DATE=${{ steps.date.outputs.day }}
            ${{ matrix.image.build-arg }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max
      # Pinned to the commit of v0.36.0 because trivy-action tags have been rewritten in the past.
      - name: Scan with Trivy (fixable HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SCAN_REF }}
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: '1'
      # Second pass on the cached database for code scanning only. It never fails the job:
      # the table scan above does.
      - name: Trivy SARIF report
        if: always() && steps.build.outcome == 'success' && github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SCAN_REF }}
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-${{ matrix.image.name }}.sarif
          exit-code: '0'
      # Code scanning on a private repository requires GitHub Advanced Security: there, the report
      # is kept as a workflow artifact instead, so that a missing feature never blocks publishing.
      - name: Upload SARIF to code scanning
        if: always() && steps.build.outcome == 'success' && github.event_name != 'pull_request' && !github.event.repository.private
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.image.name }}.sarif
          category: trivy-${{ matrix.image.name }}
      - name: Keep the SARIF report as an artifact
        if: always() && steps.build.outcome == 'success' && github.event_name != 'pull_request' && github.event.repository.private
        uses: actions/upload-artifact@v7
        with:
          name: trivy-${{ matrix.image.name }}
          path: trivy-${{ matrix.image.name }}.sarif
          if-no-files-found: ignore
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push to GHCR
        if: env.PUBLISH == 'true'
        run: docker push --all-tags "${{ steps.image.outputs.name }}"

  # Single check to require in branch protection: it always reports, whatever the jobs skipped
  # by the changes job (a skipped matrix never reports its Image (...) checks). It fails when a
  # job it needs failed or was cancelled; skipped jobs are expected.
  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, secret-scan, build, integration, gateway-smoke, e2e, frontends, docker-lint, helm, trivy-db, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the needed jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          if jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' <<< "$RESULTS" > /dev/null; then
            echo "::error::At least one CI job failed or was cancelled"
            exit 1
          fi

  # Continuous deployment of the images just published: develop to staging, main to production.
  # The environments carry the cluster credentials and the protection rules (reviewers on
  # production); deploy.yml skips with a notice while an environment is not configured.
  deploy:
    name: Deploy
    needs: [images, integration, gateway-smoke, helm]
    if: github.event_name == 'push' && !github.event.repository.fork && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    secrets: inherit

  # Public demo (docs/demo.md): the Dokploy compose application is redeployed once the images of a
  # push on main are published, and pulls them again (tag latest). Skipped with a notice while the
  # repository secret DOKPLOY_DEMO_WEBHOOK_URL is not set.
  demo:
    name: Deploy public demo
    needs: [images, integration, gateway-smoke]
    if: github.event_name == 'push' && !github.event.repository.fork && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      # Dokploy webhooks expect a push payload: the branch must match the one of the application.
      - name: Trigger the Dokploy deployment
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_DEMO_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$WEBHOOK_URL" ]]; then
            echo "::notice::No DOKPLOY_DEMO_WEBHOOK_URL secret: demo deployment skipped"
            echo "Demo deployment skipped: the repository has no \`DOKPLOY_DEMO_WEBHOOK_URL\` secret." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          payload=$(jq -cn --arg ref "$GITHUB_REF" --arg sha "$GITHUB_SHA" \
            '{ref: $ref, after: $sha, head_commit: {id: $sha, message: ("CI images sha-" + $sha[0:7])}, commits: []}')
          status=$(curl -sS --max-time 30 -o "$RUNNER_TEMP/dokploy.txt" -w '%{http_code}' -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' -H 'X-GitHub-Event: push' --data "$payload")
          if [[ "$status" != 2* ]]; then
            echo "::error::Dokploy webhook answered HTTP $status: $(head -c 300 "$RUNNER_TEMP/dokploy.txt")"
            exit 1
          fi
          echo "Demo deployment of **sha-${GITHUB_SHA::7}** requested from Dokploy." >> "$GITHUB_STEP_SUMMARY"
