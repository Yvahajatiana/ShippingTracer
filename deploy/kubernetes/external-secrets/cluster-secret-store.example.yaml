# Example ClusterSecretStore for the External Secrets Operator (ESO >= 0.17, API external-secrets.io/v1):
# Azure Key Vault reached with Microsoft Entra Workload ID (no client secret stored in the cluster).
# Copy, replace every <placeholder>, then apply it once per cluster. The chart only renders the
# ExternalSecret (externalSecrets.enabled) that points to this store.
#
# Prerequisites (az CLI):
#   1. AKS with the OIDC issuer and workload identity enabled:
#        az aks update -g <rg> -n <cluster> --enable-oidc-issuer --enable-workload-identity
#   2. A user-assigned managed identity allowed to read the vault secrets
#      (role "Key Vault Secrets User" on the vault, RBAC authorization mode):
#        az identity create -g <rg> -n parcelflow-external-secrets
#        az role assignment create --role "Key Vault Secrets User" \
#          --assignee <identity-principal-id> --scope <key-vault-resource-id>
#   3. A federated credential binding that identity to the ServiceAccount below:
#        az identity federated-credential create -g <rg> --identity-name parcelflow-external-secrets \
#          --name external-secrets-parcelflow --issuer <aks-oidc-issuer-url> \
#          --subject system:serviceaccount:external-secrets:external-secrets-parcelflow \
#          --audiences api://AzureADTokenExchange
#   4. The secrets in the vault. Key Vault names only allow letters, digits and dashes, e.g.
#        parcelflow-postgres-password, parcelflow-rabbitmq-password,
#        parcelflow-notification-client-secret (see values-production.example.yaml).
#
# AWS alternative: provider "aws" (service: SecretsManager, region, auth.jwt.serviceAccountRef) with an
# IRSA / EKS Pod Identity role allowed secretsmanager:GetSecretValue on arn:aws:secretsmanager:...:secret:parcelflow/*.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-parcelflow
  # Namespace of the External Secrets Operator.
  namespace: external-secrets
  annotations:
    # Client ID of the managed identity, and its tenant.
    azure.workload.identity/client-id: <managed-identity-client-id>
    azure.workload.identity/tenant-id: <tenant-id>
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: parcelflow-azure-keyvault
spec:
  # Only the ParcelFlow namespace may use this store.
  conditions:
    - namespaces:
        - parcelflow
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://<key-vault-name>.vault.azure.net
      serviceAccountRef:
        name: external-secrets-parcelflow
        namespace: external-secrets
