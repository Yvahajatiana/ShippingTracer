{{- /*
Standard Ingress exposing each portal on its host (the portal's nginx proxies /api/ to the
gateway on the same origin), plus the gateway on gateway.ingress.host for third-party clients.
Controller-agnostic: ingressClassName only when ingress.className is set (else cluster default).
*/ -}}
{{- if .Values.ingress.enabled }}
{{- $root := . }}
{{- $routes := list }}
{{- range $name, $portal := .Values.portals }}
{{- $routes = append $routes (dict "host" (required (printf "portals.%s.host is required when ingress.enabled" $name) $portal.host) "component" $name) }}
{{- end }}
{{- if .Values.gateway.ingress.enabled }}
{{- $routes = append $routes (dict "host" (required "gateway.ingress.host is required when gateway.ingress.enabled" .Values.gateway.ingress.host) "component" "gateway") }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "parcelflow.fullname" . }}
  labels:
    {{- include "parcelflow.labels" (dict "root" . "component" "ingress") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    {{- range $routes }}
    - hosts:
        - {{ .host | quote }}
      secretName: {{ default (printf "%s-tls" (replace "." "-" .host)) $root.Values.ingress.tls.secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $routes }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "parcelflow.componentName" (dict "root" $root "component" .component) }}
                port:
                  name: http
    {{- end }}
{{- end }}
