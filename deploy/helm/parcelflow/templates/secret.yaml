{{- /*
Application Secret rendered from secrets.values: local clusters only, the values are stored in
the Helm release history. Production uses secrets.existingSecret or externalSecrets.
Every key of secrets.values is rendered; the keys read by the workloads are required.
*/ -}}
{{- if include "parcelflow.rendersSecret" . }}
{{- $values := default dict .Values.secrets.values }}
{{- $required := list "postgres-password" "rabbitmq-password" "notification-client-secret" }}
{{- if .Values.redis.passwordFromSecret }}
{{- $required = append $required "redis-password" }}
{{- end }}
{{- if .Values.infrastructure.enabled }}
{{- $required = concat $required (list "keycloak-admin-password" "demo-user-password") }}
{{- end }}
{{- range $required }}
{{- $_ := required (printf "secrets.values.%s is required when secrets.create is true" .) (get $values .) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "parcelflow.secretName" . }}
  labels:
    {{- include "parcelflow.labels" (dict "root" . "component" "secrets") | nindent 4 }}
  {{- with (include "parcelflow.secretHookAnnotations" . | trim) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- range $key, $value := $values }}
  {{ $key }}: {{ $value | toString | b64enc | quote }}
  {{- end }}
{{- end }}
