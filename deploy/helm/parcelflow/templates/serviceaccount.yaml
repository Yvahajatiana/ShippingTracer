{{- /*
Identity of the application pods. They never call the Kubernetes API: no token is mounted and no
RBAC is granted. Annotations allow a cloud workload identity binding if one is ever needed.
*/ -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "parcelflow.serviceAccountName" . }}
  labels:
    {{- include "parcelflow.labels" (dict "root" . "component" "service-account") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
