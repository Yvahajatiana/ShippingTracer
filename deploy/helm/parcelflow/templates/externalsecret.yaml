{{- /*
External Secrets Operator: materialises the application Secret (parcelflow.secretName) from an
external store. Without migrations the operator owns the Secret (creationPolicy Owner) and deletes
it with the ExternalSecret. A value rotated in the store does not restart the pods by itself (environment
variables are read at start): roll the Deployments, or use a reloader controller.
When migrations.enabled, the ExternalSecret is a pre-install/pre-upgrade hook so the Secret exists
before the migration Jobs; the Job pods wait (CreateContainerConfigError, retried by the kubelet)
until the operator has synced it. A hook is deleted and recreated on every upgrade
(before-hook-creation), so the Secret is then orphaned (creationPolicy Orphan): it survives the
recreation and running or restarting pods never lose it. Delete it by hand after helm uninstall.
*/ -}}
{{- if .Values.externalSecrets.enabled }}
{{- $es := .Values.externalSecrets }}
{{- $data := default dict $es.data }}
{{- $required := list "postgres-password" "rabbitmq-password" "notification-client-secret" }}
{{- if .Values.redis.passwordFromSecret }}
{{- $required = append $required "redis-password" }}
{{- end }}
{{- range $required }}
{{- $_ := required (printf "externalSecrets.data.%s is required when externalSecrets.enabled is true" .) (get $data .) }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "parcelflow.secretName" . }}
  labels:
    {{- include "parcelflow.labels" (dict "root" . "component" "secrets") | nindent 4 }}
  {{- with (include "parcelflow.secretHookAnnotations" . | trim) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ required "externalSecrets.secretStoreRef.name is required when externalSecrets.enabled is true" $es.secretStoreRef.name }}
  target:
    name: {{ include "parcelflow.secretName" . }}
    creationPolicy: {{ .Values.migrations.enabled | ternary "Orphan" "Owner" }}
  data:
    {{- range $key, $ref := $data }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ required (printf "externalSecrets.data.%s.key is required" $key) $ref.key | quote }}
        {{- with $ref.property }}
        property: {{ . | quote }}
        {{- end }}
    {{- end }}
{{- end }}
